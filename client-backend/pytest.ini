[pytest]
addopts = --cov=. --cov-report=term-missing --cov-fail-under=70
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*InsecureKeyLengthWarning.*

[coverage:run]
omit =
    tests/*
    conftest.py
    */venv/*
    */__pycache__/*
